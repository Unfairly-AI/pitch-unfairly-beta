<!-- Quotes: one large pull quote, then (optionally) a row of two or three cards. Quote the
     shortest verbatim excerpt that carries the point, with name, title and company. A
     monogram (tb-mono) or the company's logo (an <img> in tb-who) sits beside the name. -->
<section id="voices" class="tb-band" data-tone="surface" data-section="voices">
  <div class="tb-wrap">
    <figure class="tb-pull rise">
      <blockquote><p>{{facts.quotes.q1.text}}</p></blockquote>
      <figcaption class="tb-who"><span class="tb-mono" aria-hidden="true">{{facts.quotes.q1.mono}}</span><span><span class="tb-who-name">{{facts.quotes.q1.name}}</span><span class="tb-who-role">{{facts.quotes.q1.role}}, {{facts.quotes.q1.org}}</span></span></figcaption>
    </figure>
    <div class="tb-quotes" style="--n:2">
      <figure class="tb-quote rise"><blockquote><p>{{facts.quotes.q2.text}}</p></blockquote><figcaption class="tb-who"><span class="tb-mono" aria-hidden="true">{{facts.quotes.q2.mono}}</span><span><span class="tb-who-name">{{facts.quotes.q2.name}}</span><span class="tb-who-role">{{facts.quotes.q2.role}}, {{facts.quotes.q2.org}}</span></span></figcaption></figure>
      <figure class="tb-quote rise" style="--d:120ms"><blockquote><p>{{facts.quotes.q3.text}}</p></blockquote><figcaption class="tb-who"><span class="tb-mono" aria-hidden="true">{{facts.quotes.q3.mono}}</span><span><span class="tb-who-name">{{facts.quotes.q3.name}}</span><span class="tb-who-role">{{facts.quotes.q3.role}}, {{facts.quotes.q3.org}}</span></span></figcaption></figure>
    </div>
  </div>
</section>
